volumes:
  mongo_data: {}

services:
  mongodb:
    image: mongo:6
    container_name: mongo_postsdb

    restart: always
    environment:
      MONGO_INITDB_DATABASE: postsDB
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    container_name: posts_api
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/postsDB
